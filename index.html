<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samíkovo brikule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12140F;
    --bg-alt:#161911;
    --card:#1B1F16;
    --card-hover:#20241A;
    --ink:#EAEDE2;
    --ink-soft:#8B9280;
    --ink-faint:#5C6353;
    --herb:#A8E063;
    --herb-dim:#5C7A3A;
    --turmeric:#F0AC44;
    --turmeric-dim:#8A6A2E;
    --clay:#F0765C;
    --line:#262B1E;
    --line-strong:#343B28;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, #1A2013 0%, transparent 45%),
      radial-gradient(1.4px 1.4px at 40px 60px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 120px 140px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.6px 1.6px at 200px 30px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 260px 180px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.2px 1.2px at 320px 90px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 80px 220px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.4px 1.4px at 360px 250px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 180px 280px, rgba(255,255,255,0.25), transparent);
    background-repeat:no-repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat;
    background-size:auto,400px 320px,400px 320px,400px 320px,400px 320px,400px 320px,400px 320px,400px 320px,400px 320px;
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:28px 18px 60px;
    min-height:100vh;
  }
  .wrap{max-width:900px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    border-bottom:1px solid var(--line-strong);
    padding-bottom:18px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  h1 .dot{color:var(--herb);}
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .reset-btn{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:12.5px;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s,color .15s;
  }
  .reset-btn:hover{border-color:var(--herb);color:var(--herb);}
  .reset-btn:active{transform:scale(0.97);}

  .entry-form{
    display:flex;
    gap:10px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .entry-form select{
    flex:1 1 200px;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:var(--card);
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .entry-form select:focus, .entry-form input[type=number]:focus{
    outline:none;
    border-color:var(--herb);
  }
  .entry-form input[type=number]{
    padding:14px 12px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:var(--card);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    color:var(--ink);
  }
  .entry-form input[type=text]{
    flex:1 1 260px;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:var(--card);
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
  }
  .entry-form input[type=text]::placeholder{color:var(--ink-faint);}
  .entry-form input[type=text]:focus{
    outline:none;
    border-color:var(--herb);
  }
  .entry-form button{
    background:var(--herb);
    color:#12140F;
    border:none;
    border-radius:10px;
    padding:0 22px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:background .15s;
  }
  .entry-form button:hover:not(:disabled){background:#BEEB80;}
  .entry-form button:disabled{opacity:.4;cursor:default;}

  .hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 22px;}
  .error-msg{
    font-size:13px;color:var(--clay);margin:-4px 0 18px;
    font-weight:500;
  }

  .tabs{
    display:flex;gap:4px;margin-bottom:24px;
    border-bottom:1px solid var(--line-strong);
  }
  .tab-btn{
    background:none;border:none;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink-faint);
    padding:10px 6px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-right:24px;
    transition:color .15s,border-color .15s;
  }
  .tab-btn.active{color:var(--ink);border-color:var(--herb);}

  /* macro strip */
  .macro-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line-strong);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .macro-box{
    background:var(--card);
    padding:16px 12px;
    text-align:center;
  }
  .macro-box .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:25px;
    font-weight:600;
    color:var(--ink);
    line-height:1.1;
  }
  .macro-box .unit{font-size:12px;color:var(--ink-soft);margin-left:2px;}
  .macro-box .lab{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:7px;
  }
  .macro-box .sub{
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-faint);
    margin-top:4px;
  }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:28px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";flex:1;height:1px;background:var(--line-strong);
  }

  /* today's food list */
  .log-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .log-chip{
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:6px 8px 6px 14px;
    font-size:13px;
    display:flex;align-items:center;gap:8px;
    max-width:100%;
  }
  .log-chip .time{color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .log-chip .name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .log-chip button{
    background:var(--line-strong);
    border:none;border-radius:50%;
    width:20px;height:20px;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .log-chip button:hover{background:var(--clay);color:#12140F;}
  .empty-log{color:var(--ink-faint);font-size:13.5px;font-style:italic;}

  /* nutrient tiles */
  .tile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(122px,1fr));
    gap:10px;
  }
  .tile{
    background:var(--card);
    border:1px solid var(--line-strong);
    border-left:3px solid var(--line-strong);
    border-radius:8px;
    padding:10px 10px 12px;
    position:relative;
    overflow:hidden;
  }
  .tile.vit{border-left-color:var(--herb-dim);}
  .tile.min{border-left-color:var(--turmeric-dim);}
  .tile .symbol{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:17px;
  }
  .tile.vit .symbol{color:var(--herb);}
  .tile.min .symbol{color:var(--turmeric);}
  .tile .name{
    font-size:11px;color:var(--ink-soft);
    margin:2px 0 10px;
    line-height:1.25;
    min-height:27px;
  }
  .tile .amt{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .tile .bar-track{
    height:5px;border-radius:3px;
    background:var(--line-strong);
    overflow:hidden;
  }
  .tile .bar-fill{height:100%;border-radius:3px;}
  .tile.vit .bar-fill{background:var(--herb);}
  .tile.min .bar-fill{background:var(--turmeric);}
  .tile .pct{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    margin-top:5px;
    text-align:right;
  }
  .tile.done{border-left-color:var(--herb);}
  .tile.done.min{border-left-color:var(--turmeric);}
  .tile .check{
    position:absolute;top:8px;right:9px;
    font-size:11px;color:var(--herb);
  }
  .tile.min .check{color:var(--turmeric);}

  /* nutrient info cards (tab 2) */
  .info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
  }
  .info-card{
    background:var(--card);
    border:1px solid var(--line-strong);
    border-left:3px solid var(--line-strong);
    border-radius:10px;
    padding:16px 16px 15px;
    cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .info-card:hover{background:var(--card-hover);}
  .info-card.vit{border-left-color:var(--herb-dim);}
  .info-card.min{border-left-color:var(--turmeric-dim);}
  .info-card.open.vit{border-color:var(--herb);border-left-color:var(--herb);}
  .info-card.open.min{border-color:var(--turmeric);border-left-color:var(--turmeric);}
  .info-card .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .info-card .badge{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    width:34px;height:34px;
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:#12140F;
    flex-shrink:0;
  }
  .info-card.vit .badge{background:var(--herb);}
  .info-card.min .badge{background:var(--turmeric);}
  .info-card h3{
    font-family:'Fraunces',serif;
    font-size:16px;font-weight:600;margin:0;
    flex:1;color:var(--ink);
  }
  .info-card .chev{
    font-size:10px;color:var(--ink-faint);flex-shrink:0;
  }
  .info-card p{
    font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0;
  }
  .info-card .sources{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line-strong);
  }
  .info-card .sources-label{
    font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:6px;font-weight:600;
  }
  .info-card .sources ul{
    margin:0;padding:0;list-style:none;
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .info-card .sources li{
    background:var(--bg-alt);
    border:1px solid var(--line-strong);
    border-radius:6px;
    padding:4px 10px;
    font-size:12px;
    color:var(--ink-soft);
  }

  .loading-note{font-size:13px;color:var(--herb);margin:-4px 0 18px;font-weight:500;}

  @media (max-width:520px){
    .macro-strip{grid-template-columns:repeat(2,1fr);}
    .log-chip .name{max-width:140px;}
  }
</style>
</head>

/* ---------- state ---------- */
let entries = [];
let activeTab = "log";
let errorMsg = "";
let expandedInfo = null;
const STORAGE_KEY = "samikovo-brikule-offline-entries";

/* ---------- storage (localStorage — plain offline file, no login needed) ---------- */
function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ entries = JSON.parse(raw); }
  }catch(e){ /* no entries yet */ }
  render();
}
function saveEntries(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
  catch(e){ console.error("Storage error", e); }
}

/* ---------- helpers ---------- */
function fmt(n, unit){
  if(n === undefined || n === null) n = 0;
  const rounded = unit === "µg" ? Math.round(n) : Math.round(n*10)/10;
  return rounded;
}
function sumField(getter){
  return entries.reduce((acc,e)=> acc + (getter(e) || 0), 0);
}
function totals(){
  return {
    kcal: sumField(e=>e.kcal),
    fat_g: sumField(e=>e.fat_g),
    carbs_g: sumField(e=>e.carbs_g),
    sugar_g: sumField(e=>e.sugar_g),
    protein_g: sumField(e=>e.protein_g),
    vitamins: Object.fromEntries(VITAMINS.map(v=>[v.key, sumField(e=>e.vitamins && e.vitamins[v.key])])),
    minerals: Object.fromEntries(MINERALS.map(m=>[m.key, sumField(e=>e.minerals && e.minerals[m.key])])),
  };
}

/* ---------- add food from local database (no network, instant) ---------- */
function addFood(foodName, grams){
  errorMsg = "";
  const food = FOODS.find(f=>f.name === foodName);
  if(!food){ errorMsg = "Vyber prosím jídlo ze seznamu."; render(); return; }
  const g = parseFloat(grams);
  if(!g || g <= 0){ errorMsg = "Zadej platnou gramáž."; render(); return; }

  const scale = g / 100;
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: food.name,
    grams: g,
    time: new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}),
    kcal: food.kcal * scale,
    fat_g: food.fat_g * scale,
    carbs_g: food.carbs_g * scale,
    sugar_g: food.sugar_g * scale,
    protein_g: food.protein_g * scale,
    vitamins: Object.fromEntries(Object.entries(food.vitamins || {}).map(([k,v])=>[k, v*scale])),
    minerals: Object.fromEntries(Object.entries(food.minerals || {}).map(([k,v])=>[k, v*scale])),
  };
  entries = [...entries, entry];
  saveEntries();
  render();
}

function removeEntry(id){
  entries = entries.filter(e=>e.id!==id);
  saveEntries();
  render();
}
window.removeEntry = removeEntry;

function resetDay(){
  entries = [];
  saveEntries();
  render();
}

function onFoodChange(){
  const select = document.getElementById("food-select");
  const gramsInput = document.getElementById("grams-input");
  const hint = document.getElementById("portion-hint");
  const food = FOODS.find(f=>f.name === select.value);
  if(food){
    gramsInput.value = food.portion_g;
    hint.textContent = "Typická porce: " + food.portion_label;
  } else {
    hint.textContent = "";
  }
}
window.onFoodChange = onFoodChange;

/* ---------- rendering ---------- */
function tileHTML(meta, value, category){
  const pct = meta.nrv ? Math.round((value / meta.nrv) * 100) : 0;
  const barPct = Math.min(pct, 100);
  const done = pct >= 100;
  return `
    <div class="tile ${category}${done?' done':''}">
      ${done ? '<span class="check">✓</span>' : ''}
      <div class="symbol">${meta.symbol}</div>
      <div class="name">${meta.name}</div>
      <div class="amt">${fmt(value, meta.unit)} / ${meta.nrv} ${meta.unit}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
      <div class="pct">${pct} %</div>
    </div>`;
}

function infoCardHTML(meta, category){
  const open = expandedInfo === meta.key;
  return `
    <div class="info-card ${category}${open?' open':''}" onclick="toggleInfo('${meta.key}')">
      <div class="head">
        <div class="badge">${meta.symbol}</div>
        <h3>${meta.name}</h3>
        <span class="chev">${open?'▲':'▼'}</span>
      </div>
      <p>${meta.desc}</p>
      ${open ? `
        <div class="sources">
          <div class="sources-label">Nejlepší zdroje</div>
          <ul>${meta.sources.map(s=>`<li>${s}</li>`).join("")}</ul>
        </div>` : ''}
    </div>`;
}

function toggleInfo(key){
  expandedInfo = (expandedInfo === key) ? null : key;
  render();
}
window.toggleInfo = toggleInfo;

function render(){
  const app = document.getElementById("app");
  const t = totals();

  const groups = [...new Set(FOODS.map(f=>f.group))];
  const foodOptions = `<option value="" disabled selected>Vyber jídlo…</option>` +
    groups.map(g=>`
      <optgroup label="${g}">
        ${FOODS.filter(f=>f.group===g).map(f=>`<option value="${f.name}">${f.name}</option>`).join("")}
      </optgroup>`).join("");

  const logTab = `
    <div class="macro-strip">
      <div class="macro-box"><div class="val">${Math.round(t.kcal)}</div><div class="lab">kcal</div></div>
      <div class="macro-box"><div class="val">${fmt(t.fat_g)}<span class="unit">g</span></div><div class="lab">Tuky</div></div>
      <div class="macro-box"><div class="val">${fmt(t.carbs_g)}<span class="unit">g</span></div><div class="lab">Sacharidy</div><div class="sub">z toho cukry ${fmt(t.sugar_g)} g</div></div>
      <div class="macro-box"><div class="val">${fmt(t.protein_g)}<span class="unit">g</span></div><div class="lab">Bílkoviny</div></div>
    </div>

    <div class="section-label">Dnešní jídla</div>
    ${entries.length === 0
      ? `<div class="empty-log">Zatím nic nezapsáno — přidej první jídlo výše.</div>`
      : `<div class="log-list">
          ${entries.map(e=>`
            <div class="log-chip">
              <span class="time">${e.time}</span>
              <span class="name" title="${e.name.replace(/"/g,'&quot;')}">${e.name} · ${Math.round(e.grams)} g</span>
              <button onclick="removeEntry('${e.id}')" title="Odebrat">×</button>
            </div>`).join("")}
        </div>`
    }

    <div class="section-label">Vitamíny</div>
    <div class="tile-grid">
      ${VITAMINS.map(v=>tileHTML(v, t.vitamins[v.key], "vit")).join("")}
    </div>

    <div class="section-label">Minerály</div>
    <div class="tile-grid">
      ${MINERALS.map(m=>tileHTML(m, t.minerals[m.key], "min")).join("")}
    </div>
  `;

  const infoTab = `
    <div class="section-label">Vitamíny</div>
    <div class="info-grid">
      ${VITAMINS.map(v=>infoCardHTML(v,"vit")).join("")}
    </div>
    <div class="section-label">Minerály</div>
    <div class="info-grid">
      ${MINERALS.map(m=>infoCardHTML(m,"min")).join("")}
    </div>
  `;

  app.innerHTML = `
    <header>
      <div><h1>Samíkovo brikule</h1></div>
      <button class="reset-btn" id="reset-btn">↻ Další den</button>
    </header>

    <div class="entry-form">
      <select id="food-select" onchange="onFoodChange()">${foodOptions}</select>
      <input type="number" id="grams-input" min="1" step="1" placeholder="g" style="max-width:90px;" />
      <button id="add-btn">Přidat</button>
    </div>
    <p class="hint" id="portion-hint"></p>
    ${errorMsg ? `<p class="error-msg">${errorMsg}</p>` : ''}

    <div class="tabs">
      <button class="tab-btn ${activeTab==='log'?'active':''}" data-tab="log">Dnešní příjem</button>
      <button class="tab-btn ${activeTab==='info'?'active':''}" data-tab="info">Co dělají živiny</button>
    </div>

    ${activeTab === 'log' ? logTab : infoTab}
  `;

  document.getElementById("reset-btn").onclick = resetDay;
  document.getElementById("add-btn").onclick = () => {
    const foodName = document.getElementById("food-select").value;
    const grams = document.getElementById("grams-input").value;
    addFood(foodName, grams);
  };
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = () => { activeTab = btn.dataset.tab; render(); };
  });
}

loadEntries();
</script>
</body>
</html>
